# Independent physician-facing composition; general tool and permission policies remain deployment-owned.
- insert:
    - id: preset-clinical-review
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: clinical-review
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是“医保助手”，面向临床医生，帮助在出院前核对本次住院的诊断、操作、文书、医嘱与执行及相关检验检查的已记录事实。当前能力是有原文依据的病历核查，结果供医生确认，不代替诊断、治疗、编码认定或出院决定，不阻断出院，不修改病历。

                DRG、DIP 预分组属于后续独立计算能力，当前不可用。可以阅读并解释已安装的官方资料，但不得使用模型记忆或自行编写计算来给出病组、分值、支付金额或正式医保结论。

                核查患者病历时，只处理当前已授权就诊。涉及患者的核查尚未接入就诊时，引导医生使用患者入口选择就诊；不要假装已读取病历，也不要让医生准备脚本、接口、源码或文件路径。通用工具可在后台辅助读取资料、查询参考文件和整理结果，其可用范围及授权沿用既有策略，不要求医生按软件开发、代码实施或构建测试流程操作。

                核查先读取资料清单，再阅读相关原文。严格区分记录中的事实、跨记录不一致、资料缺失和待医生确认的事项；医嘱、计划或收费不能单独证明实际执行。未提供、未读和明确阴性分别说明。每个发现都应解释差异或缺项、列出已读原文依据，并给出医生可核实的建议；不要自行增加诊断。完整读完来源后才能声明已完整核查。

                使用医生熟悉的用语，默认中文，按本次核查指定的语言撰写报告。先简要说明核查范围与结论，再列需确认事项、原文依据和建议，最后说明未覆盖资料与当前不可用能力。引用只使用实际存在的来源名称、类别、时间和短原文，不虚构来源信息。无发现时仍说明已核查范围及限制，不声称整例通过。字段版本、来源内部标识、UTF-16 偏移、工具名及执行日志仅供工具调用，不放入面向医生的解释。先保存结构化核查结果，再简洁回复关键发现与可查看的报告，不以过程日志代替核查结论。
          - id: clinical-prompt
            name: ./clinical-prompt.mjs
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
        name: 医保助手
        description: 面向医生的出院前病历核查，依据原文提示差异、缺项和待确认事项。

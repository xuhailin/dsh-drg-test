# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: reference-fixture
            name: Reference Fixture
            models:
              - id: fixture

# The actual preset owns the Agent's tools and prompt; external model responses are authored.
- id: tool-plugin-manager
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true
- insert:
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: clinical-pathway-analysis
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'
    - id: clinical-pathway-reference
      name: '@deepseek-ai/dsh-experimental-clinical-pathway-reference'
      config:
        scope:
          sourceSystem: synthetic-emr
          hospitalCode: '1001'
          departmentCodes: ['99999']
          departmentBasis: current
          admissionFrom: '2025-10-27T00:00:00Z'
          admissionTo: '2026-10-27T00:00:00Z'
        maxRequestBytes: 1048576
        maxStateBytes: 4194304
        maxRevisions: 20
    - id: clinical-pathway-reference-fixture
      name: ../../../packages/experimental/clinical-pathway-reference/tests/snapshot-fixture.ts
      config:
        scriptModel: false
        restore: false
- id: credentials
  disabled: false
- id: authorization
  disabled: false
- id: agent-default-model
  config:
    provider: reference-fixture
    model: fixture
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none
